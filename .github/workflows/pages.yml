# O site é publicado pelo GitHub Pages a partir da branch main, pasta raiz
# (Settings → Pages → Deploy from a branch → main / root).
# Este workflow não publica nada: só verifica, a cada push, que nenhum
# material confidencial entrou no repositório.
name: Verificar conteúdo confidencial

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nenhum arquivo de docs/ pode estar versionado
        run: |
          if git ls-files | grep -q '^docs/'; then
            echo "::error::Há arquivos de docs/ versionados. Eles seriam publicados no site. Remova-os com: git rm -r --cached docs/"
            git ls-files | grep '^docs/'
            exit 1
          fi

      - name: O site não pode apontar para docs/
        run: |
          if grep -rIl --include='*.html' --include='*.js' --include='*.css' 'docs/' index.html 404.html assets/; then
            echo "::error::O site contém referências a docs/."
            exit 1
          fi
